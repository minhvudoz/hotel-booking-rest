services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel_local_pw
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/hotel
      DB_USER: hotel
      DB_PASSWORD: hotel_local_pw
      JWT_SECRET: local-demo-secret-only-for-docker-compose-0123456789
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Duser.timezone=${APP_TZ:-Asia/Ho_Chi_Minh}"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
