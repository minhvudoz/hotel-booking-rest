services:
  - type: web
    name: hotel-booking-rest
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"

databases:
  - name: hotel-db
    plan: free
    region: singapore
    databaseName: hotel
    user: hotel
