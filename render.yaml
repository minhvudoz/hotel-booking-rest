# App chạy trên Render (free), CSDL dùng Neon Postgres (free, không hết hạn).
# Khi tạo Blueprint, Render sẽ hỏi DATABASE_URL: dán connection string lấy từ Neon.
services:
  - type: web
    name: hotel-booking-rest
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
